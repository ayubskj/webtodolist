<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aureus - Student Task & Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060c;--glass:rgba(255,255,255,.045);--line:rgba(212,175,55,.2);--g:#d4af37;--g2:#f1d98a;--tx:#ece8dd;--mu:#8a93a8;--bad:#e8788a;--warn:#e9b44c;--ok:#6fcf97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
body{font:15px/1.55 Manrope,system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 520px at 8% -8%,rgba(40,70,150,.3),transparent),radial-gradient(700px 420px at 100% 0,rgba(212,175,55,.09),transparent),var(--bg);background-attachment:fixed}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
h1,h2,h3,.brand b,.stats b,.tt,.prog b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
h1{font-size:40px;line-height:1.1;background:linear-gradient(120deg,var(--g2),var(--g) 60%,#a8841f);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:30px;color:var(--g2);margin-bottom:16px}
h3{font-size:24px;color:var(--g2);margin-bottom:14px}
.side{position:fixed;inset:0 auto 0 0;width:250px;display:flex;flex-direction:column;gap:6px;padding:calc(26px + env(safe-area-inset-top,0px)) 16px 24px;background:rgba(8,14,32,.6);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-right:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 26px}
.brand i{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--g);border-radius:12px;color:var(--g);font-style:normal;background:rgba(212,175,55,.08)}
.brand b{font-size:28px;color:var(--g2);line-height:1}
.brand small{display:block;color:var(--mu);font-size:12px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid transparent;border-radius:12px;background:none;color:var(--mu);font:inherit;font-weight:500;cursor:pointer;text-align:left}
.nv i{font-style:normal;width:20px;text-align:center;font-size:17px}
.nv:hover{color:var(--tx)}
.nv.on{color:var(--g2);background:rgba(212,175,55,.1);border-color:var(--line)}
main{margin-left:250px;padding:40px 44px 60px;max-width:1150px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.hd p{color:var(--mu)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.35);padding:18px 20px;margin-bottom:12px}
.btn{padding:11px 20px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--g2),var(--g) 55%,#b08a22);color:#1a1405;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(212,175,55,.22)}
.btn.dng{background:linear-gradient(135deg,#f0a0ac,var(--bad));color:#2a0a10;box-shadow:none}
.gh{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.04);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.gh:hover{border-color:var(--g);color:var(--g2)}
.task,.jr{display:flex;gap:18px;justify-content:space-between;align-items:flex-start}
.jr{align-items:center}
.task.dn h4{text-decoration:line-through;opacity:.55}
.tm{flex:1;min-width:0}
.tm h4{font-size:17px;font-weight:700}
.tm p{color:var(--mu);font-size:14px;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mu);font-size:13px;margin-top:4px}
.sd{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.ac{display:flex;gap:6px;flex-wrap:wrap}
.ac .gh{padding:7px 10px;font-size:13px}
.bd{font-style:normal;font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--g2);background:rgba(212,175,55,.08);white-space:nowrap}
.bd.warn{color:var(--warn);border-color:rgba(233,180,76,.4);background:rgba(233,180,76,.1)}
.bd.bad{color:var(--bad);border-color:rgba(232,120,138,.4);background:rgba(232,120,138,.1)}
.bd.ok{color:var(--ok);border-color:rgba(111,207,151,.4);background:rgba(111,207,151,.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats .card{margin:0}
.stats small{color:var(--mu)}
.stats b{display:block;font-size:46px;line-height:1.1;color:var(--g2)}
.stats .warn b{color:var(--warn)}
.stats .bad b{color:var(--bad)}
.prog{margin:12px 0 30px}
.prog div{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog b{font-size:24px;color:var(--g2)}
.prog i{display:block;height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.prog u{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));transition:width .6s}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:28px}
.tt{min-width:66px;font-size:24px;color:var(--g2);line-height:1.1;border-right:1px solid var(--line);padding-right:16px}
.tt small{color:var(--mu);font:12px Manrope,sans-serif;display:block}
.dh{margin-top:26px}
.em{padding:34px 16px;text-align:center;color:var(--mu);border:1px dashed var(--line);border-radius:16px}
dialog{border:1px solid var(--line);border-radius:20px;background:rgba(10,18,38,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:var(--tx);padding:0;width:min(580px,94vw);max-height:88vh;margin:auto;box-shadow:0 30px 80px rgba(0,0,0,.65)}
dialog[open]{animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
dialog::backdrop{background:rgba(2,4,10,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.in{padding:24px;overflow:auto;max-height:88vh}
.sub{color:var(--mu);margin:-8px 0 16px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:14px}
input,textarea,select{width:100%;margin-top:6px;padding:11px 13px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(212,175,55,.16)}
select option{background:#0b1630}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fa{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.row{display:flex;gap:10px;margin-bottom:16px}
.row input{margin:0}
.fh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fh span{display:flex;gap:8px}
.gh.up{margin:0;font-size:14px;color:var(--tx)}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ph figure{position:relative;aspect-ratio:1;margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.ph figure button{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(4,6,12,.85);color:var(--bad);cursor:pointer}
#c.lb{background:none;border:0;box-shadow:none;width:auto;-webkit-backdrop-filter:none;backdrop-filter:none}
#c.lb img{max-width:92vw;max-height:86vh;border-radius:14px;border:1px solid var(--g);display:block}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:rgba(10,18,38,.95);border:1px solid var(--g);color:var(--g2);opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.on{opacity:1}
@media(max-width:820px){
.side{inset:auto 0 0 0;width:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
.brand{display:none}
.nv{flex-direction:column;gap:2px;padding:8px 4px;font-size:11px;flex:1;align-items:center;text-align:center}
main{margin:0;padding:24px 16px 110px}
h1{font-size:34px}
.cols{grid-template-columns:1fr}
.task{flex-direction:column}
.sd{flex-direction:row-reverse;width:100%;justify-content:space-between;align-items:center}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav class="side">
<div class="brand"><i>◆</i><div><b>Aureus</b><small>Student Planner</small></div></div>
<button class="nv on" data-nav="dash"><i>◈</i><span>Dashboard</span></button>
<button class="nv" data-nav="mandiri"><i>✎</i><span>Tugas Mandiri</span></button>
<button class="nv" data-nav="kelompok"><i>❖</i><span>Tugas Kelompok</span></button>
<button class="nv" data-nav="jadwal"><i>▦</i><span>Jadwal Matkul</span></button>
</nav>
<main id="main"></main>
<dialog id="m"></dialog><dialog id="c"></dialog>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),M=$('#m'),C=$('#c'),D=new Date();
const DAY=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],order=[1,2,3,4,5,6,0];
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dl=s=>Math.round((new Date(s+'T00:00:00')-new Date(iso(new Date())+'T00:00:00'))/864e5);
const fmt=s=>new Date(s+'T00:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const sorted=a=>[...a].sort((x,y)=>x.done-y.done||x.deadline.localeCompare(y.deadline));
const byTime=(x,y)=>x.start.localeCompare(y.start);
let S,view='dash',attId,pend,tt;
const seed=()=>{const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return iso(x)};return{tasks:[
{id:uid(),type:'mandiri',title:'Laporan praktikum basis data',course:'Basis Data',deadline:d(2),desc:'ERD dan normalisasi sampai 3NF.',members:'',done:false,folders:[]},
{id:uid(),type:'kelompok',title:'Prototipe aplikasi mobile',course:'Pemrograman Mobile',deadline:d(8),desc:'Prototipe Figma dan slide presentasi.',members:'Aulia, Raka, Dewi',done:false,folders:[]}],
jadwal:[{id:uid(),course:'Basis Data',lecturer:'Dr. Hendra S., M.Kom.',building:'Gedung A',room:'A-204',day:D.getDay(),start:'08:00',end:'09:40'},
{id:uid(),course:'Pemrograman Mobile',lecturer:'Maya Putri, M.T.',building:'Gedung Lab',room:'Lab 3',day:(D.getDay()+1)%7,start:'10:00',end:'11:40'}]}};
try{S=JSON.parse(localStorage.getItem('aureus'))||seed()}catch(e){S=seed()}
const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)};
const save=()=>{try{localStorage.setItem('aureus',JSON.stringify(S))}catch(e){toast('Penyimpanan penuh. Hapus beberapa foto lalu coba lagi.')}};
const tk=id=>S.tasks.find(x=>x.id==id);
const mo=h=>{M.innerHTML='<div class=in>'+h+'</div>';M.open||M.showModal()};
const ask=(m,fn)=>{pend=fn;C.className='';C.innerHTML=`<div class=in><h2>Konfirmasi</h2><p style="margin-bottom:18px">${esc(m)}</p><div class=fa><button class=gh data-a=no>Batal</button><button class="btn dng" data-a=yes>Hapus</button></div></div>`;C.showModal()};
const head=(t,s,b='')=>`<header class=hd><div><h1>${t}</h1><p>${s}</p></div>${b}</header>`;
const empty=m=>`<div class=em>${m}</div>`;
const dlTxt=t=>{if(t.done)return['Selesai','ok'];const n=dl(t.deadline);return n<0?['Terlambat '+-n+' hari','bad']:n==0?['Hari ini','warn']:[n+' hari lagi',n<=3?'warn':'']};
const fld=(n,l,v,x='')=>`<label>${l}<input name=${n} value="${esc(v)}" ${x}></label>`;
const btns='<div class=fa><button type=button class=gh data-a=close>Batal</button><button class=btn>Simpan</button></div>';

const taskCard=(t,acts)=>{const[l,c]=dlTxt(t),n=t.folders.reduce((a,f)=>a+f.photos.length,0);
return `<article class="card task ${t.done?'dn':''}"><div class=tm><h4>${esc(t.title)}</h4><div class=meta><span>${esc(t.course||'Tanpa matkul')}</span><span>Deadline ${fmt(t.deadline)}</span>${t.type=='kelompok'&&t.members?`<span>Anggota: ${esc(t.members)}</span>`:''}</div>${t.desc?`<p>${esc(t.desc)}</p>`:''}</div><div class=sd><em class="bd ${c}">${l}</em>${acts?`<div class=ac><button class=gh data-a=tog data-id=${t.id} title="Tandai selesai">${t.done?'↺ Buka lagi':'✓ Selesai'}</button><button class=gh data-a=att data-id=${t.id}>📎 Lampiran ${n}</button><button class=gh data-a=edt data-id=${t.id}>✎ Edit</button><button class=gh data-a=del data-id=${t.id}>🗑 Hapus</button></div>`:''}</div></article>`};
const jRow=(j,m)=>`<article class="card jr"><div class=tt>${j.start}<small>${j.end}</small></div><div class=tm><h4>${esc(j.course)}</h4><div class=meta><span>Dosen: ${esc(j.lecturer||'-')}</span><span>${esc(j.building||'-')}</span><span>Ruang ${esc(j.room||'-')}</span></div></div>${m?'':`<div class=ac><button class=gh data-a=ej data-id=${j.id}>✎ Edit</button><button class=gh data-a=dj data-id=${j.id}>🗑 Hapus</button></div>`}</article>`;

function vDash(){const T=S.tasks,done=T.filter(t=>t.done).length,act=T.filter(t=>!t.done),late=act.filter(t=>dl(t.deadline)<0).length,soon=act.filter(t=>{const n=dl(t.deadline);return n>=0&&n<=3}).length,pct=T.length?Math.round(done/T.length*100):0;
const today=S.jadwal.filter(j=>j.day==D.getDay()).sort(byTime);
return head('Dashboard',D.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+
`<div class=stats>${[['Total tugas',T.length,''],['Selesai',done,''],['Mendesak (3 hari)',soon,'warn'],['Terlambat',late,'bad']].map(([l,v,c])=>`<div class="card ${c}"><small>${l}</small><b>${v}</b></div>`).join('')}</div>
<div class="card prog"><div><span>Progres penyelesaian</span><b>${pct}%</b></div><i><u style="width:${pct}%"></u></i></div>
<div class=cols><section><h3>Deadline terdekat</h3>${sorted(act).slice(0,5).map(t=>taskCard(t)).join('')||empty('Semua tugas selesai. Waktunya istirahat.')}</section>
<section><h3>Jadwal hari ini</h3>${today.map(j=>jRow(j,1)).join('')||empty('Tidak ada kuliah hari ini.')}</section></div>`}

function vTasks(type){const L=sorted(S.tasks.filter(t=>t.type==type)),k=type=='mandiri';
return head(k?'Tugas Mandiri':'Tugas Kelompok','Diurutkan otomatis dari deadline terdekat',`<button class=btn data-a=new data-t=${type}>+ Tambah tugas</button>`)+(L.map(t=>taskCard(t,1)).join('')||empty('Belum ada tugas. Klik "Tambah tugas" untuk memulai.'))}

function vJadwal(){const b=order.map(d=>{const L=S.jadwal.filter(j=>j.day==d).sort(byTime);return L.length?`<h3 class=dh>${DAY[d]}</h3>${L.map(j=>jRow(j)).join('')}`:''}).join('');
return head('Jadwal Matkul','Jadwal kuliah mingguan Anda','<button class=btn data-a=newj>+ Tambah jadwal</button>')+(b||empty('Belum ada jadwal. Klik "Tambah jadwal" untuk memulai.'))}

const V={dash:vDash,mandiri:()=>vTasks('mandiri'),kelompok:()=>vTasks('kelompok'),jadwal:vJadwal};
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav==view));$('#main').innerHTML=V[view]()}

function formT(type,t){t=t||{};const k=type=='kelompok';
mo(`<h2>${t.id?'Edit':'Tambah'} tugas ${k?'kelompok':'mandiri'}</h2><form data-form=task data-id="${t.id||''}" data-t=${type}>${fld('title','Judul tugas',t.title,'required')}${fld('course','Mata kuliah',t.course)}${k?fld('members','Anggota kelompok',t.members,'placeholder="Pisahkan dengan koma"'):''}${fld('deadline','Deadline (pilih dari kalender)',t.deadline||iso(new Date()),'type=date required onclick="try{this.showPicker()}catch(e){}"')}<label>Deskripsi<textarea name=desc rows=3>${esc(t.desc)}</textarea></label>${btns}</form>`)}

function formJ(j){j=j||{day:D.getDay(),start:'08:00',end:'09:40'};
mo(`<h2>${j.id?'Edit':'Tambah'} jadwal</h2><form data-form=jd data-id="${j.id||''}">${fld('course','Mata kuliah',j.course,'required')}${fld('lecturer','Dosen',j.lecturer)}<div class=g2>${fld('building','Gedung',j.building)}${fld('room','Ruangan',j.room)}</div><label>Hari<select name=day>${order.map(d=>`<option value=${d} ${d==j.day?'selected':''}>${DAY[d]}</option>`).join('')}</select></label><div class=g2>${fld('start','Jam mulai',j.start,'type=time required')}${fld('end','Jam selesai',j.end,'type=time required')}</div>${btns}</form>`)}

function vAtt(id){const t=tk(id);if(!t)return;
mo(`<h2>Lampiran tugas</h2><p class=sub>${esc(t.title)}</p><form data-form=folder data-id=${id} class=row><input name=name placeholder="Nama folder baru" required><button class=btn>+ Folder</button></form>${t.folders.map(f=>`<div class=card><div class=fh><b>📁 ${esc(f.name)} (${f.photos.length})</b><span><label class="gh up">⬆ Unggah foto<input type=file accept="image/*" multiple hidden data-up=${f.id}></label><button class=gh data-a=df data-id=${id} data-f=${f.id}>🗑 Folder</button></span></div><div class=ph>${f.photos.map(p=>`<figure><img src="${p.src}" alt="${esc(p.name)}" data-a=zoom><button title="Hapus foto" data-a=dp data-id=${id} data-f=${f.id} data-p=${p.id}>✕</button></figure>`).join('')||'<small style="color:var(--mu)">Belum ada foto.</small>'}</div></div>`).join('')||empty('Belum ada folder. Buat folder untuk mulai menyimpan foto.')}<div class=fa><button class=gh data-a=close>Tutup</button></div>`)}

const shrink=f=>new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const im=new Image;im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.onerror=()=>r(null);im.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)});

document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-nav]');if(!b)return;const{a,id,t,f,p,nav}=b.dataset;
if(nav){view=nav;render();scrollTo(0,0);return}
const task=tk(id);
({close:()=>M.close(),
new:()=>formT(t),
edt:()=>formT(task.type,task),
tog:()=>{task.done=!task.done;save();render()},
del:()=>ask(`Hapus tugas "${task.title}" beserta seluruh lampirannya?`,()=>{S.tasks=S.tasks.filter(x=>x!==task);save();render()}),
att:()=>{attId=id;vAtt(id)},
df:()=>ask('Hapus folder ini beserta semua fotonya?',()=>{task.folders=task.folders.filter(x=>x.id!=f);save();vAtt(id);render()}),
dp:()=>ask('Hapus foto ini?',()=>{const fo=task.folders.find(x=>x.id==f);fo.photos=fo.photos.filter(x=>x.id!=p);save();vAtt(id);render()}),
zoom:()=>{C.className='lb';C.innerHTML=`<img src="${b.src}" alt="">`;C.showModal()},
newj:()=>formJ(),
ej:()=>formJ(S.jadwal.find(x=>x.id==id)),
dj:()=>ask('Hapus jadwal kuliah ini?',()=>{S.jadwal=S.jadwal.filter(x=>x.id!=id);save();render()}),
yes:()=>{C.close();const fn=pend;pend=null;fn&&fn()},
no:()=>C.close()})[a]?.()});

document.addEventListener('submit',e=>{e.preventDefault();const fm=e.target,o=Object.fromEntries(new FormData(fm)),{form,id,t}=fm.dataset;
if(form=='task'){const x=tk(id);x?Object.assign(x,o):S.tasks.push({id:uid(),type:t,done:false,folders:[],members:'',...o});M.close()}
else if(form=='jd'){o.day=+o.day;const x=S.jadwal.find(k=>k.id==id);x?Object.assign(x,o):S.jadwal.push({id:uid(),...o});M.close()}
else if(form=='folder'){tk(id).folders.push({id:uid(),name:o.name.trim(),photos:[]});vAtt(id)}
save();render()});
